<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% block title %}TheActivityMaster{% endblock %}</title>
    <style>
      /* Basic email styling */
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333333;
        margin: 0;
        padding: 0;
        background-color: #f6f6f6;
      }

      .container {
        width: 90%;
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      .header {
        background: linear-gradient(to right, #e53935, #fb8c00);
        text-align: center;
        padding: 20px 0;
      }

      .header img {
        max-width: 150px;
        border: 3px solid #ffffff;
        border-radius: 50%;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .content {
        padding: 20px;
      }

      .footer {
        text-align: center;
        padding: 10px 0;
        font-size: 12px;
        color: #777777;
        background-color: #f2f2f2;
      }

      .button {
        display: inline-block;
        padding: 12px 24px;
        margin: 10px 0;
        text-decoration: none;
        border-radius: 4px;
        background: linear-gradient(to right, #e53935, #fb8c00);
        color: #ffffff;
        font-weight: bold;
      }

      .centered {
        text-align: center;
      }

      a {
        color: #e53935;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      /* Dark Mode Support */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #222222;
          color: #cccccc;
        }
        .container {
          background-color: #333333;
          box-shadow: none;
        }
        .header {
          background: linear-gradient(to right, #bb2d3b, #f57c00);
        }
        .footer {
          background-color: #2a2a2a;
          color: #aaaaaa;
        }
        .button {
          background: linear-gradient(to right, #bb2d3b, #f57c00);
          color: #ffffff;
        }
        a {
          color: #f57c00;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header / Logo -->
      <div class="header">
        <img src="{{ logo_url }}" alt="TheActivityMaster Logo">
      </div>

      <!-- Main Content -->
      <div class="content">
        {% block content %}{% endblock %}
      </div>

      <!-- Footer -->
      <div class="footer">
        <p>&copy; {{ current_year | default("2025") }} TheActivityMaster. All rights reserved. 😊</p>
      </div>
    </div>
  </body>
</html>
